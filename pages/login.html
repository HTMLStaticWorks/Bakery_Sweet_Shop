<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to Sweet Symphony — Access your sweet orders, custom cake drawings, and loyalty points." />
  <title>Login — Sweet Symphony</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍰</text></svg>">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link id="rtl-stylesheet" rel="stylesheet" href="../assets/css/rtl.css" disabled />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="auth-container">
  <div class="auth-form-side">
    <!-- Auth Page Toggles (RTL & Theme) -->
    <div class="auth-controls">
      <button class="nav-icon-btn" onclick="window.Scala.RTLManager.toggle()" title="Toggle RTL" aria-label="Toggle RTL" style="font-size: 0.78rem; font-weight: 550;">RTL</button>
      <button class="nav-icon-btn" onclick="window.Scala.ThemeManager.toggle()" title="Toggle Theme" aria-label="Toggle theme">
        <i class="theme-toggle-icon fas fa-moon"></i>
      </button>
    </div>

    <div class="auth-form-container">
      <a href="../index.html" class="auth-logo">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px; color:#fff; display:block;">
            <path d="M6 15h12M4 20h16M12 4v4M12 11h.01M9 11h.01M15 11h.01" />
            <rect x="5" y="8" width="14" height="7" rx="1" />
            <rect x="3" y="15" width="18" height="5" rx="1" />
          </svg>
        </div>
        <span class="brand-name">Sweet <span>Symphony</span></span>
      </a>

      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Sign in to access your custom sweet boxes, cake designs, and orders.</p>

      <!-- Login form -->
      <form data-validate-form>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" data-validate="required,email" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-toggle">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" data-validate="required,minLength:6" autocomplete="current-password" />
            <button type="button" class="toggle-btn fas fa-eye" aria-label="Toggle password visibility"></button>
          </div>
        </div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; margin-bottom: 1.5rem;">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" />
            <label for="remember" style="font-size: .88rem; color: var(--text-secondary); cursor: pointer;">Remember me</label>
          </div>
          <a href="#" style="font-size: .85rem; color: var(--primary); font-weight: 500; text-decoration: none;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:1.5rem;">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <div class="auth-divider">or continue with</div>

        <div class="social-signin">
          <button class="social-btn" type="button"><i class="fab fa-google"></i> Google</button>
          <button class="social-btn" type="button"><i class="fab fa-apple"></i> Apple</button>
        </div>
      </form>

      <div class="auth-footer">
        New client? <a href="register.html">Create a portal account</a>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
</body>
</html>
